<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111">
  <title>Responsible AI &amp; AI Safety</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; grid-template-rows: 1fr auto; background: #111; color: #fff; font: 14px system-ui, sans-serif; }
    main { min-height: 0; display: grid; place-items: center; position: relative; }
    #slide { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
    .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; border: 0; border-radius: 6px; background: #1119; color: white; font-size: 30px; cursor: pointer; }
    .arrow:hover, .arrow:focus-visible { background: #111d; }
    #prev { left: 16px; }
    #next { right: 16px; }
    footer { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 12px 16px; }
    #count { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; color: #ccc; }
    .control { border: 1px solid #555; border-radius: 4px; background: #222; color: #fff; padding: 8px 12px; cursor: pointer; }
    .control:hover, .control:focus-visible { background: #383838; }
    #slides { display: flex; gap: 4px; max-width: min(60vw, 620px); overflow-x: auto; padding: 3px; }
    .thumb { flex: 0 0 32px; border: 1px solid #555; border-radius: 3px; background: #222; color: #ddd; padding: 5px 0; cursor: pointer; font-size: 11px; }
    .thumb[aria-current="true"] { border-color: white; background: white; color: #111; }
    @media (max-width: 600px) {
      .arrow { width: 36px; height: 48px; }
      #prev { left: 5px; }
      #next { right: 5px; }
      footer { gap: 8px; padding: 8px 6px; }
      #slides { max-width: 45vw; }
      .control { padding: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <img id="slide" src="assets/slide-01.png" alt="Slide 1 of 20">
    <button class="arrow" id="prev" aria-label="Previous slide">‹</button>
    <button class="arrow" id="next" aria-label="Next slide">›</button>
  </main>
  <footer>
    <button class="control" id="back" aria-label="Previous slide">←</button>
    <span id="count" aria-live="polite">1 / 20</span>
    <div id="slides" aria-label="Choose slide"></div>
    <button class="control" id="forward" aria-label="Next slide">→</button>
  </footer>
  <script>
    const total = 20;
    let current = 1;
    const image = document.getElementById("slide");
    const count = document.getElementById("count");
    const thumbs = document.getElementById("slides");
    const filename = n => `assets/slide-${String(n).padStart(2, "0")}.png`;

    for (let n = 1; n <= total; n++) {
      const button = document.createElement("button");
      button.className = "thumb";
      button.textContent = n;
      button.setAttribute("aria-label", `Go to slide ${n}`);
      button.addEventListener("click", () => show(n));
      thumbs.append(button);
    }

    function show(n) {
      current = ((n - 1 + total) % total) + 1;
      image.src = filename(current);
      image.alt = `Slide ${current} of ${total}`;
      count.textContent = `${current} / ${total}`;
      for (const [index, button] of [...thumbs.children].entries()) {
        button.setAttribute("aria-current", index + 1 === current ? "true" : "false");
      }
      thumbs.children[current - 1].scrollIntoView({ block: "nearest", inline: "nearest" });
    }

    document.getElementById("prev").addEventListener("click", () => show(current - 1));
    document.getElementById("back").addEventListener("click", () => show(current - 1));
    document.getElementById("next").addEventListener("click", () => show(current + 1));
    document.getElementById("forward").addEventListener("click", () => show(current + 1));
    document.addEventListener("keydown", event => {
      if (event.key === "ArrowRight" || event.key === " ") {
        event.preventDefault();
        show(current + 1);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        show(current - 1);
      }
    });
    show(1);
  </script>
</body>
</html>
