<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Pull request submission diagram</title>
  <desc id="desc">An original diagram showing a project branch proposing files for review before merging to the main branch.</desc>
