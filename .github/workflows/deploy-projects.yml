name: Deploy submitted projects

on:
  push:
    branches:
      - main
    paths:
      - "projects/**"
      - "projects.json"

permissions:
  contents: write

concurrency:
  group: deploy-submitted-projects
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set deployment results path
        run: echo "DEPLOYMENT_RESULTS_PATH=$RUNNER_TEMP/deployment-results.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate metadata and project folders
        run: npm run validate:submissions
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@61.0.0
      - name: Deploy submitted projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
          DEPLOY_ALL_PROJECTS: "true"
        run: npm run deploy:projects
      - name: Commit deployment URLs
        run: |
          if git diff --quiet -- projects.json; then
            echo "No deployment URL changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git commit -m "Link deployed projects to gallery"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "main advanced during deployment; merging latest metadata (attempt $attempt)."
            git fetch origin main
            if ! git merge --no-edit origin/main; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ "$conflicts" != "projects.json" ]; then
                echo "Unexpected merge conflict: $conflicts"
                exit 1
              fi
              git show origin/main:projects.json > projects.json
              npm run apply:deployment-results
              git add projects.json
              git commit --no-edit
            fi
          done
          echo "Could not push deployment URLs after 3 attempts."
          exit 1
